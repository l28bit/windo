name: WINDO Repair Laboratory

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only diagnostic experiment
        required: true
        default: diagnose-ps51
        type: choice
        options:
          - diagnose-ps51
          - repair-generated-artifacts
          - verify-release-trust
          - full-recovery-drill
      target_ref:
        description: Branch, tag, or SHA to inspect
        required: true
        default: jonex/windo-production-ready
        type: string

permissions:
  contents: read

concurrency:
  group: windo-repair-lab-${{ inputs.target_ref }}-${{ inputs.mode }}
  cancel-in-progress: true

jobs:
  ps51-diagnostic:
    name: PS5.1 runtime diagnosis / ${{ matrix.runner }}
    if: inputs.mode == 'diagnose-ps51' || inputs.mode == 'full-recovery-drill'
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false

      - name: Prove DPAPI resolution and round-trip
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path repair-lab | Out-Null

          if (Test-Path -LiteralPath '.\tools\Test-WindoPs51DpapiRuntime.ps1' -PathType Leaf) {
            .\tools\Test-WindoPs51DpapiRuntime.ps1 *>&1 |
              Tee-Object -FilePath repair-lab/dpapi-runtime.txt
            exit
          }

          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add("PSVersion=$($PSVersionTable.PSVersion)")
          $lines.Add("CLRVersion=$($PSVersionTable.CLRVersion)")
          $lines.Add("OS=$([Environment]::OSVersion.VersionString)")
          Add-Type -AssemblyName System.Security -ErrorAction Stop
          $typeName = 'System.Security.Cryptography.ProtectedData'
          $resolved = $null
          foreach ($assembly in [AppDomain]::CurrentDomain.GetAssemblies()) {
            $candidate = $assembly.GetType($typeName, $false, $false)
            if ($null -ne $candidate) { $resolved = $candidate; break }
          }
          if ($null -eq $resolved) { throw 'ProtectedData remained unresolved after loading System.Security.' }

          $scopeType = $resolved.Assembly.GetType('System.Security.Cryptography.DataProtectionScope', $true, $false)
          $scope = [Enum]::Parse($scopeType, 'CurrentUser')
          $plain = [Text.Encoding]::UTF8.GetBytes('windo-repair-lab-roundtrip')
          $protect = $resolved.GetMethod('Protect', [type[]]@([byte[]], [byte[]], $scopeType))
          $unprotect = $resolved.GetMethod('Unprotect', [type[]]@([byte[]], [byte[]], $scopeType))
          $cipher = $protect.Invoke($null, @($plain, $null, $scope))
          $roundTrip = $unprotect.Invoke($null, @($cipher, $null, $scope))
          if ([Text.Encoding]::UTF8.GetString($roundTrip) -cne 'windo-repair-lab-roundtrip') {
            throw 'DPAPI round-trip returned unexpected plaintext.'
          }
          $lines.Add("ResolvedType=$($resolved.AssemblyQualifiedName)")
          $lines.Add("CipherBytes=$($cipher.Length)")
          $lines.Add('RoundTrip=PASS')
          $lines | Set-Content -LiteralPath repair-lab/dpapi-runtime.txt -Encoding UTF8
          $lines | ForEach-Object { Write-Host $_ }

      - name: Probe normalized embedded-uninstaller parity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = [IO.File]::ReadAllText((Resolve-Path 'windo_install.ps1'))
          $uninstaller = [IO.File]::ReadAllText((Resolve-Path 'windo_uninstall.ps1'))
          $normalize = {
            param([string]$Text)
            if ($null -eq $Text) { return $null }
            return $Text.Replace("`r`n", "`n").Replace("`r", "`n").TrimEnd("`n")
          }
          $needle = '$UninstallContent = @'''
          $start = $installer.IndexOf($needle, [StringComparison]::Ordinal)
          if ($start -lt 0) { throw 'Could not locate installer UninstallContent assignment.' }
          $contentStart = $installer.IndexOf("`n", $start, [StringComparison]::Ordinal)
          if ($contentStart -lt 0) { throw 'Could not locate embedded uninstaller content start.' }
          $contentStart++
          $anchor = 'Write-Utf8NoBomFile -Path $UninstallPath -Content $UninstallContent'
          $anchorIndex = $installer.IndexOf($anchor, $contentStart, [StringComparison]::Ordinal)
          if ($anchorIndex -lt 0) { throw 'Could not locate embedded uninstaller write marker.' }
          $end = $installer.LastIndexOf("`n'@", $anchorIndex, [StringComparison]::Ordinal)
          if ($end -lt $contentStart) { throw 'Could not locate embedded uninstaller terminator.' }
          $embedded = $installer.Substring($contentStart, ($end + 1) - $contentStart)
          $equal = (& $normalize $embedded) -ceq (& $normalize $uninstaller)
          "PublishedTextNormalizedEqual=$equal" | Set-Content repair-lab/uninstaller-parity.txt -Encoding UTF8
          if (-not $equal) { throw 'Normalized embedded-uninstaller parity failed.' }

      - name: Upload PS5.1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: repair-lab-ps51-${{ matrix.runner }}-${{ github.run_id }}
          path: repair-lab
          if-no-files-found: warn
          retention-days: 30

  generated-preview:
    name: Deterministic generated-artifact preview
    if: inputs.mode == 'repair-generated-artifacts' || inputs.mode == 'full-recovery-drill'
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Regenerate candidate in disposable checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path repair-preview | Out-Null
          ./tools/Encode-ChildExec.ps1
          ./tools/Prometheus-RepairGeneratedArtifacts.ps1
          ./tools/Sync-InstallerChecksum.ps1
          git status --short | Tee-Object -FilePath repair-preview/git-status.txt
          git diff --binary -- . | Set-Content repair-preview/repair.patch -Encoding UTF8

      - name: Validate regenerated candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/Test-WindoReservedVariables.ps1
          ./tools/Test-WindoLogic.ps1
          ./tools/Invoke-PrometheusLocalValidation.ps1 -Mode PreSign -Worker -WorkerLabel 'Read-only Repair Laboratory preview'

      - name: Upload exact preview evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: generated-repair-preview-${{ github.run_id }}
          path: repair-preview
          if-no-files-found: warn
          retention-days: 30

  release-trust:
    name: Release trust forensics
    if: inputs.mode == 'verify-release-trust' || inputs.mode == 'full-recovery-drill'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false

      - name: Verify source, manifest, key, and snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path trust-lab | Out-Null
          ./tools/Test-WindoChecksumSignature.ps1 *>&1 | Tee-Object trust-lab/signature.txt
          $signatureExit = $LASTEXITCODE
          ./tools/Validate-Windo.ps1 -RequireCurrentSnapshot *>&1 | Tee-Object trust-lab/release-validation.txt
          $validationExit = $LASTEXITCODE
          Get-FileHash bootstrap.ps1,windo_install.ps1,windo_uninstall.ps1,windo_runner.ps1 -Algorithm SHA256 |
            Format-Table -AutoSize | Out-String -Width 240 | Set-Content trust-lab/source-hashes.txt
          Get-Content checksums/installer.sha256 | Set-Content trust-lab/manifest.txt
          Get-Content keys/windo-release-public.rsa.xml | Set-Content trust-lab/public-key.xml
          @(
            "SignatureExit=$signatureExit",
            "ValidationExit=$validationExit"
          ) | Set-Content trust-lab/outcomes.txt
          if ($signatureExit -ne 0 -or $validationExit -ne 0) {
            throw 'Release trust forensics found a failing trust or snapshot invariant.'
          }

      - name: Upload trust evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: release-trust-evidence-${{ github.run_id }}
          path: trust-lab
          if-no-files-found: warn
          retention-days: 30
