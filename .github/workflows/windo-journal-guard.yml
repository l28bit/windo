name: WINDO Engineer Journal Guard

on:
  pull_request:
    branches:
      - jonex/windo-production-ready
      - Exodus
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journal-contract:
    name: Engineer Journal contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout full comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node 24
        with:
          fetch-depth: 0

      - name: Require journal update for material engineering changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          mapfile -t changed < <(git diff --name-only "$base" "$head")

          printf '%s\n' "${changed[@]}" | tee /tmp/windo-changed-files.txt

          material=0
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/*|src/*|tools/*|checksums/*|versions/*|keys/*|bootstrap.ps1|windo_*.ps1)
                material=1
                ;;
              docs/*architecture*|docs/*Architecture*|docs/*contract*|docs/*Contract*|docs/*security*|docs/*Security*|docs/*compatibility*|docs/*Compatibility*|docs/*release*|docs/*Release*)
                material=1
                ;;
            esac
          done

          if [[ "$material" -eq 0 ]]; then
            echo "No material engineering change detected; journal update is optional."
            exit 0
          fi

          journal_updated=0
          if printf '%s\n' "${changed[@]}" | grep -Fxq 'docs/ENGINEER_JOURNAL.md'; then
            journal_updated=1
          fi

          mapfile -t modular_entries < <(
            printf '%s\n' "${changed[@]}" |
              grep -E '^docs/engineer-journal/[0-9]{4}-[0-9]{2}-[0-9]{2}-.+\.md$' || true
          )
          if [[ "${#modular_entries[@]}" -gt 0 ]]; then
            journal_updated=1
          fi

          if [[ "$journal_updated" -ne 1 ]]; then
            echo '::error file=docs/ENGINEER_JOURNAL.md::Material engineering changes require an Engineer Journal update.'
            echo 'Update docs/ENGINEER_JOURNAL.md or add a dated structured entry under docs/engineer-journal/.'
            echo 'Record context, evidence, alternatives, decision, result, and follow-up.'
            exit 1
          fi

          echo 'Engineer Journal update detected for material engineering changes.'

      - name: Validate canonical journal structure
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/ENGINEER_JOURNAL.md
          grep -Fq '# WINDO Engineer Journal' docs/ENGINEER_JOURNAL.md
          grep -Fq '### Alternatives considered' docs/ENGINEER_JOURNAL.md
          grep -Fq '### Decision / hypothesis' docs/ENGINEER_JOURNAL.md
          grep -Fq '### Result' docs/ENGINEER_JOURNAL.md
          grep -Fq '### Follow-up' docs/ENGINEER_JOURNAL.md

      - name: Validate changed modular journal entries
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          mapfile -t entries < <(
            git diff --name-only "$base" "$head" |
              grep -E '^docs/engineer-journal/[0-9]{4}-[0-9]{2}-[0-9]{2}-.+\.md$' || true
          )

          for entry in "${entries[@]}"; do
            echo "Validating Engineer Journal entry: $entry"
            test -s "$entry"
            grep -Eq '^## [0-9]{4}-[0-9]{2}-[0-9]{2} — .+' "$entry"
            grep -Fq '**Category:**' "$entry"
            grep -Fq '**Status:**' "$entry"
            grep -Fq '**Related:**' "$entry"
            grep -Fq '### Context / question' "$entry"
            grep -Fq '### Evidence / observations' "$entry"
            grep -Fq '### Alternatives considered' "$entry"
            grep -Fq '### Decision / hypothesis' "$entry"
            grep -Fq '### Result' "$entry"
            grep -Fq '### Follow-up' "$entry"
          done

          echo "Validated ${#entries[@]} modular Engineer Journal entr$( [[ ${#entries[@]} -eq 1 ]] && echo 'y' || echo 'ies' )."
