name: WINDO Workflow Definition Guard

on:
  push:
    branches:
      - jonex/windo-production-ready
      - ci/fabric-hardening-20260905
    paths:
      - '.github/workflows/**'
      - 'tools/Test-WindoWorkflowPolicy.ps1'
  pull_request:
    branches:
      - jonex/windo-production-ready
    paths:
      - '.github/workflows/**'
      - 'tools/Test-WindoWorkflowPolicy.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windo-workflow-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  definitions:
    name: Actions syntax + WINDO policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24

      - name: Run actionlint pinned to immutable upstream commit
        shell: bash
        env:
          ACTIONLINT_COMMIT: 914e7df21a07ef503a81201c76d2b11c789d3fca
        run: |
          set -euo pipefail
          go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_COMMIT}" -color

      - name: Enforce WINDO workflow trust and side-effect policy
        shell: pwsh
        run: ./tools/Test-WindoWorkflowPolicy.ps1

      - name: Guard summary
        if: always()
        shell: pwsh
        run: |
          $lines = @(
            '## WINDO workflow definition guard',
            '',
            '- GitHub Actions syntax/expression lint: actionlint pinned to commit 914e7df21a07ef503a81201c76d2b11c789d3fca',
            '- External actions: immutable SHA policy enforced',
            '- Deprecated Node 20 Action pins: forbidden',
            '- Write-capable workflows: explicit allow-list enforced',
            '- Direct source-branch mutation and force pushes: forbidden',
            '- Manual diagnostic workflows: trigger policy enforced'
          )
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($lines -join "`n") -Encoding UTF8
