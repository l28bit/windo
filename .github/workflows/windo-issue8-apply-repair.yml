name: WINDO Issue 8 Repair Materializer

on:
  push:
    branches:
      - fix/ps51-dpapi-resolution-20260904
    paths:
      - tools/Apply-WindoIssue8DpapiRepair.ps1
      - .github/workflows/windo-issue8-apply-repair.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: windo-issue8-repair-materializer
  cancel-in-progress: false

jobs:
  materialize:
    name: Certify and materialize isolated Issue 8 repair
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      REPAIR_BASE: fix/ps51-dpapi-resolution-20260904
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record immutable repair source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ github.sha }}') {
            throw "Checkout drift: expected ${{ github.sha }}, got $actual"
          }
          Write-Host "Repair source commit: $actual"

      - name: Apply exact source repair and regenerate artifacts
        shell: pwsh
        run: ./tools/Apply-WindoIssue8DpapiRepair.ps1

      - name: Strict Windows PowerShell 5.1 runtime proof
        shell: powershell
        run: .\tools\Test-WindoPs51DpapiRuntime.ps1

      - name: PowerShell 7 control proof
        shell: pwsh
        run: ./tools/Test-WindoPs51DpapiRuntime.ps1

      - name: Synchronize unsigned release checksum candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/Sync-InstallerChecksum.ps1
          Write-Host 'Updated checksums/installer.sha256 for the repaired candidate.'
          Write-Host 'The private checksums/installer.sha256.sig is intentionally untouched.'

      - name: Pre-sign runtime validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/Test-WindoReservedVariables.ps1
          ./tools/Invoke-PrometheusLocalValidation.ps1 -Mode PreSign -Worker -WorkerLabel 'Issue #8 isolated repair materialization'

      - name: Append Engineer Journal repair entry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $journal = 'docs/ENGINEER_JOURNAL.md'
          $title = '## 2026-09-04 — Issue #8 gets a strict no-waiver DPAPI runtime repair'
          $current = [IO.File]::ReadAllText((Resolve-Path -LiteralPath $journal))
          if ($current.Contains($title)) {
            Write-Host 'Issue #8 Engineer Journal entry already exists.'
            exit 0
          }

          $lines = @(
            '',
            '---',
            '',
            '## 2026-09-04 — Issue #8 gets a strict no-waiver DPAPI runtime repair',
            '',
            '**Category:** incident / experiment / security  ',
            '**Status:** active  ',
            '**Related:** Issue #8, branch `fix/ps51-dpapi-resolution-20260904`, `WINDO Issue 8 DPAPI Certification`',
            '',
            '### Context / question',
            '',
            'PR #6 deliberately landed the CI, recovery, and Engineer Journal platform without pretending the known Windows PowerShell 5.1 DPAPI defect was repaired. The next clean development branch therefore needed a finish line that could not inherit the temporary Issue #8 baseline waiver.',
            '',
            '### Evidence / observations',
            '',
            '- The production baseline proved fresh Windows PowerShell 5.1 could not initially resolve `System.Security.Cryptography.ProtectedData` on Windows Server 2022 or 2025.',
            '- The temporary baseline also proved `Add-Type -AssemblyName System.Security` restores usable CurrentUser DPAPI in the same process.',
            '- A first repair experiment loaded `System.Security` and repeated the existing `Type.GetType(..., System.Security)` lookup. The assembly loaded successfully, but the short assembly-name lookup still returned null in a fresh PS5.1 process.',
            '- A second experiment loaded `System.Security` and resolved `ProtectedData` from the assemblies actually loaded into the current AppDomain. The strict shipping-helper probe then completed a real DPAPI protect/unprotect round-trip under Windows PowerShell 5.1.',
            '- PowerShell 7 passed the same strict shipping-helper probe without using the PS5.1 fallback.',
            '',
            '### Alternatives considered',
            '',
            '- Leave the temporary Issue #8 baseline in place and call the compatibility problem acceptable.',
            '- Add `System.Security` loading but continue relying on the same assembly-qualified lookup that the experiment proved ineffective.',
            '- Directly reference `ProtectedData` after the assembly load without verifying the exact shipping helper path.',
            '- Load the framework assembly only for PowerShell 5.x, resolve the type from the loaded AppDomain assemblies, and certify the actual helper through an extracted-AST runtime probe.',
            '',
            '### Decision / hypothesis',
            '',
            'Keep the existing PowerShell 7-friendly assembly-qualified lookup first. Only when running PowerShell 5.x and those lookups fail, explicitly load the .NET Framework `System.Security` assembly and search the current AppDomain assemblies for the exact `System.Security.Cryptography.ProtectedData` type.',
            '',
            'The repair is applied once to canonical `windo_runner.ps1`. `Prometheus-RepairGeneratedArtifacts.ps1` then propagates the canonical runner into the installer rather than allowing hand-edited embedded payloads.',
            '',
            'The strict Issue #8 certification intentionally has no known-baseline waiver: both Windows Server 2022 and 2025 must prove a real CurrentUser DPAPI round-trip under Windows PowerShell 5.1, with PowerShell 7 as a control.',
            '',
            '### Result',
            '',
            'The controlled repair demonstrated that the AppDomain-resolution approach restores the actual shipping helper under fresh Windows PowerShell 5.1 while preserving the PowerShell 7 path. The repair is materialized on an isolated automation branch so CI never races a moving source branch.',
            '',
            'The release is not yet considered publishable because changing the signed runtime requires refreshed release metadata and a new private signature outside hosted CI.',
            '',
            '### Follow-up',
            '',
            '- Run the complete PS5.1/PS7 × Windows Server 2022/2025 Issue #8 certification matrix on the reviewable repair PR.',
            '- Correct the two PS5.1 host-sensitive test assertions without weakening their security properties.',
            '- Remove the temporary `Test-WindoKnownPs51Baseline.ps1` waiver once strict PS5.1 validation is green without it.',
            '- Refresh release hashes/snapshot and sign only in the private signing environment.',
            '- Complete privileged Windows install/elevate/stdout/stderr/exit-code/Ctrl+C/uninstall certification before publication.'
          )
          Add-Content -LiteralPath $journal -Value ($lines -join "`n") -Encoding UTF8
          Add-Content -LiteralPath $journal -Value "`n" -Encoding UTF8
          Write-Host 'Appended Issue #8 experiment and repair decision to the Engineer Journal.'

      - name: Restrict repair diff to declared files
        id: diff
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $allowed = @(
            'windo_runner.ps1',
            'windo_install.ps1',
            'tools/ChildExec.b64.txt',
            'checksums/installer.sha256',
            'docs/prometheus-generated-repair-report.md',
            'docs/ENGINEER_JOURNAL.md'
          )
          $changed = @(git status --porcelain | ForEach-Object { $_.Substring(3) })
          foreach ($path in $changed) {
            if ($path -notin $allowed) {
              throw "Issue #8 materializer changed an undeclared path: $path"
            }
          }
          if ($changed.Count -eq 0) {
            'changed=false' >> $env:GITHUB_OUTPUT
            Write-Host 'No repair diff remains.'
          } else {
            'changed=true' >> $env:GITHUB_OUTPUT
            Write-Host 'Certified repair diff:'
            git status --short
            git diff -- windo_runner.ps1 windo_install.ps1 tools/ChildExec.b64.txt checksums/installer.sha256 docs/prometheus-generated-repair-report.md docs/ENGINEER_JOURNAL.md
          }

      - name: Commit certified repair to isolated branch
        id: branch
        if: steps.diff.outputs.changed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $branch = 'automation/issue8-repair-${{ github.run_id }}'
          git config user.name 'windo-repair-bot'
          git config user.email 'windo-repair-bot@users.noreply.github.com'
          git switch -c $branch
          git add -- windo_runner.ps1 windo_install.ps1 tools/ChildExec.b64.txt checksums/installer.sha256 docs/prometheus-generated-repair-report.md docs/ENGINEER_JOURNAL.md
          git commit -m 'fix: restore PS5.1 DPAPI runtime resolution'
          git push origin "HEAD:refs/heads/$branch"
          "branch=$branch" >> $env:GITHUB_OUTPUT
          Write-Host "Materialized certified repair on $branch"

      - name: Open reviewable materialization PR
        if: steps.diff.outputs.changed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $branch = '${{ steps.branch.outputs.branch }}'
          $body = @(
            '## Issue #8 certified repair materialization',
            '',
            'This PR was generated from the immutable source commit `${{ github.sha }}`.',
            '',
            'Before materialization the workflow proved:',
            '- the actual shipping DPAPI helper under Windows PowerShell 5.1;',
            '- the PowerShell 7 control path;',
            '- deterministic generated-runtime propagation;',
            '- synchronized unsigned release hashes;',
            '- the complete hosted PreSign contract.',
            '',
            'The private checksum signature is intentionally not generated or modified in hosted CI.',
            '',
            'This branch exists specifically to avoid CI mutating or racing the source branch it is validating.'
          ) -join "`n"
          $output = & gh pr create --repo '${{ github.repository }}' --base $env:REPAIR_BASE --head $branch --title 'Fix: restore native DPAPI resolution under Windows PowerShell 5.1' --body $body 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "The certified repair branch was pushed successfully, but automatic PR creation was unavailable: $($output -join ' ')"
            Write-Host "Open a PR from $branch into $env:REPAIR_BASE."
            exit 0
          }
          $output | ForEach-Object { Write-Host $_ }

      - name: Materialization summary
        if: always()
        shell: pwsh
        run: |
          $lines = @(
            '## WINDO Issue #8 repair materialization',
            '',
            '- Source commit: `${{ github.sha }}`',
            '- Source branch: `fix/ps51-dpapi-resolution-20260904`',
            '- Repair branch: `${{ steps.branch.outputs.branch }}`',
            '- Private signing key used: **No**',
            '- Source branch mutated by this workflow: **No**'
          )
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($lines -join "`n") -Encoding UTF8
