name: Prometheus Repair Synchronization

on:
  push:
    branches:
      - Exodus
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize-generated-artifacts:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: repair/inline-elevation
          fetch-depth: 0

      - name: Apply, verify, and commit Prometheus repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $chunkRoot = '.prometheus/chunks8'
          $encodedPath = '.prometheus/reconstructed.patch.gz.b64'
          $patchPath = 'prometheus-inline-elevation.patch'
          $diagnosticPath = '.prometheus/apply-diagnostic.txt'
          $expectedEncodedLength = 48048
          $expectedEncodedSha256 = 'B22B36DD9EDDCB0B3532CB89CD40D0EFE8C33D21B72E48A5313A44B994747482'
          $expectedPatchLength = 188643
          $expectedPatchSha256 = '22ABD920FD2FAA36FF2D86981291CE9D20A51BBBFAD7CC7CDB294BE1A7C197A4'
          $diagnostic = [System.Collections.Generic.List[string]]::new()
          $success = $false

          function Get-BytesSha256 {
            param([Parameter(Mandatory = $true)][byte[]]$Bytes)
            $sha = [Security.Cryptography.SHA256]::Create()
            try {
              return (-join ($sha.ComputeHash($Bytes) | ForEach-Object { $_.ToString('X2') }))
            } finally {
              $sha.Dispose()
            }
          }

          function Test-PrometheusPatchMarkers {
            $checks = @(
              @{ Path = 'src/windo/snippets/ChildExec.cs'; Pattern = 'RunPowerShellStreaming' },
              @{ Path = 'windo_runner.ps1'; Pattern = 'StdOutStreamPath' },
              @{ Path = 'windo_runner.ps1'; Pattern = 'CancelPath' },
              @{ Path = 'windo_install.ps1'; Pattern = '_windo_new_live_stream_state' },
              @{ Path = 'windo_install.ps1'; Pattern = '_windo_signal_runner_cancel' },
              @{ Path = 'tools/Test-WindoLogic.ps1'; Pattern = 'RunPowerShellStreaming' }
            )
            foreach ($check in $checks) {
              if (-not (Test-Path -LiteralPath $check.Path -PathType Leaf)) { return $false }
              if (-not (Select-String -LiteralPath $check.Path -SimpleMatch -Quiet -Pattern $check.Pattern)) { return $false }
            }
            return $true
          }

          try {
            $expectedChunks = 0..6 | ForEach-Object { Join-Path $chunkRoot ('{0:D3}.txt' -f $_) }
            foreach ($chunk in $expectedChunks) {
              if (-not (Test-Path -LiteralPath $chunk)) { throw "Missing staged repair chunk: $chunk" }
            }

            $encoded = -join ($expectedChunks | ForEach-Object { ([IO.File]::ReadAllText((Resolve-Path -LiteralPath $_)) -replace '\s', '') })
            $encodedBytes = [Text.Encoding]::ASCII.GetBytes($encoded)
            $encodedSha = Get-BytesSha256 -Bytes $encodedBytes
            $diagnostic.Add("encoded_length=$($encoded.Length)")
            $diagnostic.Add("encoded_sha256=$encodedSha")
            if ($encoded.Length -ne $expectedEncodedLength) {
              throw "Encoded repair payload length mismatch: expected $expectedEncodedLength, got $($encoded.Length)."
            }
            if ($encodedSha -cne $expectedEncodedSha256) {
              throw "Encoded repair payload SHA256 mismatch: expected $expectedEncodedSha256, got $encodedSha."
            }
            [IO.File]::WriteAllText($encodedPath, $encoded, [Text.Encoding]::ASCII)

            $gzipBytes = [Convert]::FromBase64String($encoded)
            $input = [IO.MemoryStream]::new($gzipBytes, $false)
            $gzip = [IO.Compression.GZipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
            $output = [IO.MemoryStream]::new()
            try {
              $gzip.CopyTo($output)
              $patchBytes = $output.ToArray()
            } finally {
              $output.Dispose()
              $gzip.Dispose()
              $input.Dispose()
            }

            $patchSha = Get-BytesSha256 -Bytes $patchBytes
            $diagnostic.Add("patch_length=$($patchBytes.Length)")
            $diagnostic.Add("patch_sha256=$patchSha")
            if ($patchBytes.Length -ne $expectedPatchLength) {
              throw "Repair patch length mismatch: expected $expectedPatchLength, got $($patchBytes.Length)."
            }
            if ($patchSha -cne $expectedPatchSha256) {
              throw "Repair patch SHA256 mismatch: expected $expectedPatchSha256, got $patchSha."
            }
            [IO.File]::WriteAllBytes($patchPath, $patchBytes)

            $checkOutput = & git apply --check -p1 --whitespace=nowarn $patchPath 2>&1
            $checkExit = $LASTEXITCODE
            $diagnostic.Add("git_apply_check_exit=$checkExit")
            foreach ($line in @($checkOutput)) { $diagnostic.Add("check: $line") }

            if ($checkExit -eq 0) {
              $applyOutput = & git apply -p1 --whitespace=nowarn $patchPath 2>&1
              $applyExit = $LASTEXITCODE
              $diagnostic.Add("git_apply_exit=$applyExit")
              foreach ($line in @($applyOutput)) { $diagnostic.Add("apply: $line") }
              if ($applyExit -ne 0) { throw 'Prometheus repair patch application failed.' }
              $diagnostic.Add('patch_state=applied_now')
            } elseif (Test-PrometheusPatchMarkers) {
              $diagnostic.Add('patch_state=already_applied_and_markers_verified')
            } else {
              throw 'Prometheus repair patch neither applies cleanly nor has a verified applied-state marker set.'
            }

            $repairOutput = & ./tools/Prometheus-RepairGeneratedArtifacts.ps1 2>&1
            foreach ($line in @($repairOutput)) { $diagnostic.Add("repair: $line") }
            $diagnostic.Add('repair_script=success')

            $success = $true
            $diagnostic.Add('result=success')

            Remove-Item -LiteralPath '.prometheus/inline-elevation.patch.gz.b64' -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath '.prometheus/chunks' -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath '.prometheus/chunks8' -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $encodedPath -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $patchPath -Force -ErrorAction SilentlyContinue
          } catch {
            $diagnostic.Add('result=failure')
            $diagnostic.Add("exception=$($_.Exception.Message)")
          } finally {
            $diagnostic.Add("utc=$([DateTime]::UtcNow.ToString('o'))")
            $diagnosticParent = Split-Path -Parent $diagnosticPath
            if (-not (Test-Path -LiteralPath $diagnosticParent)) {
              New-Item -ItemType Directory -Path $diagnosticParent -Force | Out-Null
            }
            [IO.File]::WriteAllLines($diagnosticPath, $diagnostic, [Text.UTF8Encoding]::new($false))

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add --all
            if (-not (git diff --cached --quiet)) {
              $message = if ($success) { 'repair: finalize Prometheus generated artifacts' } else { 'diagnostic: capture Prometheus repair reconstruction failure' }
              git commit -m $message
              git push origin HEAD:repair/inline-elevation
            }
          }

          if (-not $success) {
            throw "Prometheus repair did not complete. See $diagnosticPath on repair/inline-elevation."
          }
