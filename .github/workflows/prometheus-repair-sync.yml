name: Prometheus Repair Synchronization

on:
  push:
    branches:
      - Exodus
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize-generated-artifacts:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: repair/inline-elevation
          fetch-depth: 0

      - name: Apply, verify, and commit Prometheus repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $encodedPath = '.prometheus/inline-elevation.patch.gz.b64'
          $patchPath = 'prometheus-inline-elevation.patch'
          $diagnosticPath = '.prometheus/apply-diagnostic.txt'
          $diagnostic = [System.Collections.Generic.List[string]]::new()
          $success = $false

          try {
            if (-not (Test-Path -LiteralPath $encodedPath)) {
              throw "Missing staged repair payload: $encodedPath"
            }

            $python = @'
          import base64
          import gzip
          from pathlib import Path

          encoded_path = Path('.prometheus/inline-elevation.patch.gz.b64')
          patch_path = Path('prometheus-inline-elevation.patch')
          encoded = ''.join(encoded_path.read_text(encoding='utf-8').split())
          patch_path.write_bytes(gzip.decompress(base64.b64decode(encoded)))
          print(f'decoded_bytes={patch_path.stat().st_size}')
          '@
            $decodeOutput = $python | python - 2>&1
            $diagnostic.Add("python_decode_exit=$LASTEXITCODE")
            foreach ($line in @($decodeOutput)) { $diagnostic.Add("python: $line") }
            if ($LASTEXITCODE -ne 0) { throw 'Python patch decode failed.' }

            $checkOutput = & git apply --check -p1 --whitespace=nowarn $patchPath 2>&1
            $checkExit = $LASTEXITCODE
            $diagnostic.Add("git_apply_check_exit=$checkExit")
            foreach ($line in @($checkOutput)) { $diagnostic.Add("check: $line") }
            if ($checkExit -ne 0) { throw 'Prometheus repair patch preflight failed.' }

            $applyOutput = & git apply -p1 --whitespace=nowarn $patchPath 2>&1
            $applyExit = $LASTEXITCODE
            $diagnostic.Add("git_apply_exit=$applyExit")
            foreach ($line in @($applyOutput)) { $diagnostic.Add("apply: $line") }
            if ($applyExit -ne 0) { throw 'Prometheus repair patch application failed.' }

            $repairOutput = ./tools/Prometheus-RepairGeneratedArtifacts.ps1 2>&1
            $repairExit = $LASTEXITCODE
            $diagnostic.Add("repair_script_exit=$repairExit")
            foreach ($line in @($repairOutput)) { $diagnostic.Add("repair: $line") }
            if ($repairExit -ne 0) { throw 'Generated-artifact repair verification failed.' }

            Remove-Item -LiteralPath $encodedPath -Force
            Remove-Item -LiteralPath $patchPath -Force -ErrorAction SilentlyContinue
            $success = $true
            $diagnostic.Add('result=success')
          } catch {
            $diagnostic.Add("result=failure")
            $diagnostic.Add("exception=$($_.Exception.Message)")
          } finally {
            $diagnostic.Add("utc=$([DateTime]::UtcNow.ToString('o'))")
            [IO.File]::WriteAllLines($diagnosticPath, $diagnostic, [Text.UTF8Encoding]::new($false))

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add --all
            if (-not (git diff --cached --quiet)) {
              $message = if ($success) { 'repair: wire Prometheus inline elevation end to end' } else { 'diagnostic: capture Prometheus patch application failure' }
              git commit -m $message
              git push origin HEAD:repair/inline-elevation
            }
          }

          if (-not $success) {
            throw "Prometheus repair did not complete. See $diagnosticPath on repair/inline-elevation."
          }
