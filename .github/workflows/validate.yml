name: WINDO Fast Gate

on:
  pull_request:
    branches:
      - jonex/windo-production-ready
  push:
    branches:
      - jonex/windo-production-ready
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windo-fast-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: WINDO Fast Gate
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate with comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          fetch-depth: 0

      - name: Windows PowerShell 5.1 parser compatibility
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'bootstrap.ps1',
            'windo_install.ps1',
            'windo_runner.ps1',
            'windo_uninstall.ps1',
            'windo_heal.ps1',
            'windo_self_update.ps1',
            'tools/Test-WindoLogic.ps1',
            'tools/Test-WindoReservedVariables.ps1',
            'tools/Test-WindoJournalContract.ps1',
            'tools/Validate-Windo.ps1'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing required PowerShell source: $file"
            }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "Windows PowerShell 5.1 parse failed: $file"
            }
          }
          Write-Host 'Windows PowerShell 5.1 parser compatibility: PASS'

      - name: Reserved-variable safety
        shell: pwsh
        run: ./tools/Test-WindoReservedVariables.ps1

      - name: Fast source logic
        shell: pwsh
        run: ./tools/Test-WindoLogic.ps1

      - name: Engineer Journal contract
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'pull_request') {
            ./tools/Test-WindoJournalContract.ps1 -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA
          } else {
            ./tools/Test-WindoJournalContract.ps1
          }

      - name: Fast Gate summary
        if: always()
        shell: pwsh
        run: |
          $lines = @(
            '## WINDO Fast Gate',
            '',
            '- Windows PowerShell 5.1 parse compatibility',
            '- Reserved automatic-variable safety',
            '- Fast source logic',
            '- Engineer Journal contract',
            '',
            'Deep Windows/runtime/release certification intentionally runs in WINDO Deep Certification.'
          )
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($lines -join "`n") -Encoding UTF8
