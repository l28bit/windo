name: Validate PowerShell

permissions:
  contents: read

on:
  push:
    branches:
      - Exodus
      - Genisis
      - main
      - jonex/windo-production-ready
      - ci/hosted-runner-lab-20260903
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches:
      - Exodus
      - Genisis
      - main
      - jonex/windo-production-ready

env:
  WINDO_DEVELOPMENT_PRESIGN: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}

jobs:
  powershell-51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Initialize diagnostics
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path ci-forensics | Out-Null

      - name: Install PSScriptAnalyzer
        id: module
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery -RequiredVersion 1.25.0 -ErrorAction Stop

      - name: Validate syntax and release contract
        id: release
        if: always()
        shell: powershell
        run: |
          if ($env:WINDO_DEVELOPMENT_PRESIGN -eq 'true') {
            .\tools\Validate-Windo.ps1 -RequireCurrentSnapshot -DevelopmentPreSign
          } else {
            .\tools\Validate-Windo.ps1 -RequireCurrentSnapshot
          }

      - name: Logic tests
        id: logic
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path ci-forensics/logic-transcript.txt -Force | Out-Null
          try {
            .\tools\Test-WindoLogic.ps1
          } finally {
            Stop-Transcript | Out-Null
          }

      - name: Transparent shell completion contract
        if: always()
        shell: powershell
        run: .\tools\Test-WindoTransparentCompletion.ps1

      - name: PSScriptAnalyzer
        id: analyzer
        if: always()
        shell: powershell
        run: .\tools\Invoke-PSScriptAnalyzer.ps1

      - name: Enforce strict PS5.1 results (no issue 8 waiver)
        if: always()
        shell: powershell
        run: |
          $outcomes = @(
            '${{ steps.module.outcome }}',
            '${{ steps.release.outcome }}',
            '${{ steps.logic.outcome }}',
            '${{ steps.analyzer.outcome }}'
          )
          if (@($outcomes | Where-Object { $_ -ne 'success' }).Count -ne 0) {
            throw ('PS5.1 required checks failed or did not execute: ' + ($outcomes -join ', '))
          }

  powershell-7:
    name: PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery -RequiredVersion 1.25.0 -ErrorAction Stop
      - name: Validate syntax and release contract
        shell: pwsh
        run: |
          if ($env:WINDO_DEVELOPMENT_PRESIGN -eq 'true') {
            ./tools/Validate-Windo.ps1 -RequireCurrentSnapshot -DevelopmentPreSign
          } else {
            ./tools/Validate-Windo.ps1 -RequireCurrentSnapshot
          }
      - name: Logic tests
        if: always()
        shell: pwsh
        run: ./tools/Test-WindoLogic.ps1
      - name: Transparent shell completion contract
        if: always()
        shell: pwsh
        run: ./tools/Test-WindoTransparentCompletion.ps1
      - name: PSScriptAnalyzer
        if: always()
        shell: pwsh
        run: ./tools/Invoke-PSScriptAnalyzer.ps1
