name: Prometheus Validation

# Hosted Actions are intentionally manual-only while project validation runs
# through tools/Invoke-PrometheusLocalValidation.ps1 on a Windows workstation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    name: Windows PowerShell 5.1 pre-sign
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Parse release scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'bootstrap.ps1',
            'windo_install.ps1',
            'windo_runner.ps1',
            'windo_uninstall.ps1',
            'tools/Test-WindoLogic.ps1',
            'tools/Validate-Windo.ps1',
            'tools/Test-WindoReservedVariables.ps1',
            'tools/Invoke-PrometheusLocalValidation.ps1'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing required file: $file" }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "PowerShell parse failed: $file"
            }
          }

      - name: Reject reserved automatic-variable assignments
        shell: powershell
        run: .\tools\Test-WindoReservedVariables.ps1

      - name: Run logic tests
        shell: powershell
        run: .\tools\Test-WindoLogic.ps1

      - name: Verify ChildExec source payload parity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = [IO.File]::ReadAllText((Resolve-Path 'src/windo/snippets/ChildExec.cs'))
          $encoded = ([IO.File]::ReadAllText((Resolve-Path 'tools/ChildExec.b64.txt')) -replace '\s','')
          $decoded = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($encoded))
          if ($source -cne $decoded) { throw 'ChildExec.cs and ChildExec.b64.txt are not byte-equivalent.' }

      - name: Run pre-sign release validation
        shell: powershell
        run: .\tools\Invoke-PrometheusLocalValidation.ps1 -Mode PreSign -Worker -WorkerLabel 'Windows PowerShell 5.1'

  powershell-7:
    name: PowerShell 7 pre-sign
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Parse release scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'bootstrap.ps1',
            'windo_install.ps1',
            'windo_runner.ps1',
            'windo_uninstall.ps1',
            'tools/Test-WindoLogic.ps1',
            'tools/Validate-Windo.ps1',
            'tools/Test-WindoReservedVariables.ps1',
            'tools/Invoke-PrometheusLocalValidation.ps1'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing required file: $file" }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "PowerShell parse failed: $file"
            }
          }

      - name: Reject reserved automatic-variable assignments
        shell: pwsh
        run: ./tools/Test-WindoReservedVariables.ps1

      - name: Run logic tests
        shell: pwsh
        run: ./tools/Test-WindoLogic.ps1

      - name: Verify ChildExec source payload parity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = [IO.File]::ReadAllText((Resolve-Path 'src/windo/snippets/ChildExec.cs'))
          $encoded = ([IO.File]::ReadAllText((Resolve-Path 'tools/ChildExec.b64.txt')) -replace '\s','')
          $decoded = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($encoded))
          if ($source -cne $decoded) { throw 'ChildExec.cs and ChildExec.b64.txt are not byte-equivalent.' }

      - name: Run pre-sign release validation
        shell: pwsh
        run: ./tools/Invoke-PrometheusLocalValidation.ps1 -Mode PreSign -Worker -WorkerLabel 'PowerShell 7'

      - name: Export exact checked-out source
        shell: pwsh
        run: git archive --format=zip --output=prometheus-source.zip HEAD

      - name: Upload exact checked-out source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prometheus-source
          path: prometheus-source.zip
          if-no-files-found: error
          retention-days: 3

  signature-gate:
    name: Private-key release signature
    runs-on: windows-latest
    needs:
      - windows-powershell-51
      - powershell-7
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify checksum signature
        shell: pwsh
        run: ./tools/Test-WindoChecksumSignature.ps1
