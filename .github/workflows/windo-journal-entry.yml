name: WINDO Engineer Journal Capture

on:
  workflow_dispatch:
    inputs:
      title:
        description: Short journal entry title
        required: true
        type: string
      category:
        description: Engineering category
        required: true
        default: experiment
        type: choice
        options:
          - decision
          - experiment
          - incident
          - architecture
          - release
          - security
          - tooling
          - process
      status:
        description: Entry status
        required: true
        default: active
        type: choice
        options:
          - proposed
          - active
          - validated
          - resolved
          - superseded
      related:
        description: PR / issue / run / commit references
        required: false
        type: string
      context:
        description: What question or problem were we addressing?
        required: true
        type: string
      evidence:
        description: Evidence and observations
        required: true
        type: string
      alternatives:
        description: Alternatives considered; separate items with semicolons
        required: true
        type: string
      decision:
        description: Decision or current hypothesis and why
        required: true
        type: string
      result:
        description: Result, including failed experiment outcome if applicable
        required: true
        type: string
      follow_up:
        description: Follow-up items; separate items with semicolons
        required: true
        type: string
      base_ref:
        description: Branch from which to create the journal-entry branch
        required: true
        default: jonex/windo-production-ready
        type: string

permissions:
  contents: write

concurrency:
  group: windo-journal-capture-${{ inputs.base_ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: Materialize modular Engineer Journal entry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JOURNAL_TITLE: ${{ inputs.title }}
      JOURNAL_CATEGORY: ${{ inputs.category }}
      JOURNAL_STATUS: ${{ inputs.status }}
      JOURNAL_RELATED: ${{ inputs.related }}
      JOURNAL_CONTEXT: ${{ inputs.context }}
      JOURNAL_EVIDENCE: ${{ inputs.evidence }}
      JOURNAL_ALTERNATIVES: ${{ inputs.alternatives }}
      JOURNAL_DECISION: ${{ inputs.decision }}
      JOURNAL_RESULT: ${{ inputs.result }}
      JOURNAL_FOLLOW_UP: ${{ inputs.follow_up }}
      BASE_REF: ${{ inputs.base_ref }}
    steps:
      - name: Checkout journal base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ inputs.base_ref }}
          fetch-depth: 0

      - name: Build structured modular entry
        id: entry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $related = $env:JOURNAL_RELATED
          if ([string]::IsNullOrWhiteSpace($related)) {
            $related = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          }
          $entry = ./tools/New-WindoJournalEntry.ps1 `
            -Title $env:JOURNAL_TITLE `
            -Category $env:JOURNAL_CATEGORY `
            -Status $env:JOURNAL_STATUS `
            -Related $related `
            -Context $env:JOURNAL_CONTEXT `
            -Evidence $env:JOURNAL_EVIDENCE `
            -Alternatives $env:JOURNAL_ALTERNATIVES `
            -Decision $env:JOURNAL_DECISION `
            -Result $env:JOURNAL_RESULT `
            -FollowUp $env:JOURNAL_FOLLOW_UP `
            -EntryId '${{ github.run_id }}'
          "path=$($entry.RelativePath)" >> $env:GITHUB_OUTPUT
          Write-Host "Generated $($entry.RelativePath)"

      - name: Validate journal structure
        shell: pwsh
        run: ./tools/Test-WindoJournalContract.ps1

      - name: Commit isolated journal branch
        id: branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $branch = 'journal/entry-${{ github.run_id }}'
          $path = '${{ steps.entry.outputs.path }}'
          if ([string]::IsNullOrWhiteSpace($path) -or -not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw "Journal entry output path is missing or invalid: $path"
          }
          git config user.name 'windo-journal-bot'
          git config user.email 'windo-journal-bot@users.noreply.github.com'
          git switch -c $branch
          git add -- $path
          git commit -m "docs: capture Engineer Journal entry"
          git push origin "HEAD:refs/heads/$branch"
          "branch=$branch" >> $env:GITHUB_OUTPUT

      - name: Capture summary
        if: always()
        shell: pwsh
        run: |
          $lines = @(
            '## WINDO Engineer Journal Capture',
            '',
            '- Base ref: ${{ inputs.base_ref }}',
            '- Entry file: ${{ steps.entry.outputs.path }}',
            '- Materialized branch: ${{ steps.branch.outputs.branch }}',
            '- Pull request creation attempted by this workflow: No',
            '- Canonical journal history rewritten: No'
          )
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($lines -join "`n") -Encoding UTF8
