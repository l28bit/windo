name: WINDO CI Fabric

on:
  push:
    branches:
      - jonex/windo-production-ready
      - ci/hosted-runner-lab-20260903
  pull_request:
    branches:
      - jonex/windo-production-ready
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PSSCRIPTANALYZER_VERSION: '1.25.0'

jobs:
  source-contract:
    name: Source + trust contract
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Parse critical scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'bootstrap.ps1',
            'windo_install.ps1',
            'windo_runner.ps1',
            'windo_uninstall.ps1',
            'windo_heal.ps1',
            'tools/Test-WindoLogic.ps1',
            'tools/Test-WindoKnownPs51Baseline.ps1',
            'tools/Validate-Windo.ps1',
            'tools/Test-WindoReservedVariables.ps1',
            'tools/Invoke-PrometheusLocalValidation.ps1',
            'tools/Test-WindoChecksumSignature.ps1'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing required file: $file" }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "PowerShell parse failed: $file"
            }
          }

      - name: Reject reserved automatic-variable assignments
        shell: pwsh
        run: ./tools/Test-WindoReservedVariables.ps1

      - name: Verify ChildExec source payload parity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = [IO.File]::ReadAllText((Resolve-Path 'src/windo/snippets/ChildExec.cs'))
          $encoded = ([IO.File]::ReadAllText((Resolve-Path 'tools/ChildExec.b64.txt')) -replace '\s','')
          $decoded = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($encoded))
          if ($source -cne $decoded) { throw 'ChildExec.cs and ChildExec.b64.txt are not byte-equivalent.' }

      - name: Verify production source contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrap = Get-Content -LiteralPath bootstrap.ps1 -Raw
          foreach ($needle in @(
            'jonex/windo-production-ready',
            'WINDO_RELEASE_COMMIT',
            'WINDO_TRACKING_BRANCH',
            'api.github.com/repos/l28bit/windo/commits/'
          )) {
            if ($bootstrap.IndexOf($needle, [StringComparison]::Ordinal) -lt 0) {
              throw "bootstrap.ps1 is missing required release-contract marker: $needle"
            }
          }

      - name: Verify signed release manifest
        shell: pwsh
        run: ./tools/Test-WindoChecksumSignature.ps1

  compatibility-ps51:
    name: PS5.1 / ${{ matrix.runner }}
    needs: source-contract
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Initialize diagnostics
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path ci-forensics | Out-Null

      - name: Install PSScriptAnalyzer
        id: module
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -ErrorAction Stop

      - name: Probe Windows PowerShell 5.1 DPAPI resolution
        id: dpapi
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add("PSVersion=$($PSVersionTable.PSVersion)")
          $lines.Add("CLRVersion=$($PSVersionTable.CLRVersion)")
          $lines.Add("OS=$([Environment]::OSVersion.VersionString)")

          $directType = $null
          try { $directType = [System.Security.Cryptography.ProtectedData] } catch { $lines.Add("DirectTypeError=$($_.Exception.Message)") }
          $lines.Add("DirectType=$directType")

          $resolved = $null
          foreach ($qualifiedName in @(
            'System.Security.Cryptography.ProtectedData, System.Security.Cryptography.ProtectedData',
            'System.Security.Cryptography.ProtectedData, System.Security'
          )) {
            try {
              $candidate = [type]::GetType($qualifiedName, $false)
              $lines.Add("GetType[$qualifiedName]=$candidate")
              if ($null -eq $resolved -and $null -ne $candidate) { $resolved = $candidate }
            } catch {
              $lines.Add("GetTypeError[$qualifiedName]=$($_.Exception.Message)")
            }
          }

          $directProtectOk = $false
          if ($null -ne $directType) {
            try {
              $bytes = [Text.Encoding]::UTF8.GetBytes('windo-ci-dpapi-probe')
              $sealed = [System.Security.Cryptography.ProtectedData]::Protect(
                $bytes,
                $null,
                [System.Security.Cryptography.DataProtectionScope]::CurrentUser
              )
              $directProtectOk = $null -ne $sealed -and $sealed.Length -gt 0
              $lines.Add("DirectProtectBytes=$($sealed.Length)")
            } catch {
              $lines.Add("DirectProtectError=$($_.Exception.Message)")
            }
          }
          $lines.Add("DirectProtectOk=$directProtectOk")
          $lines.Add("WindoResolverFoundType=$($null -ne $resolved)")
          $lines | Set-Content -LiteralPath ci-forensics/ps51-dpapi-probe.txt
          $lines | ForEach-Object { Write-Host $_ }

          if (-not $directProtectOk) {
            throw 'Windows PowerShell 5.1 cannot perform direct CurrentUser DPAPI protection on this supported Windows runner.'
          }
          if ($null -eq $resolved) {
            throw 'WINDO DPAPI type-resolution strategy cannot find ProtectedData under Windows PowerShell 5.1 even though direct DPAPI works.'
          }

      - name: Release validation
        id: release
        if: always()
        shell: powershell
        run: .\tools\Validate-Windo.ps1 -RequireCurrentSnapshot

      - name: Logic tests
        id: logic
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path ci-forensics/logic-transcript.txt -Force | Out-Null
          try {
            .\tools\Test-WindoLogic.ps1
          } finally {
            Stop-Transcript | Out-Null
          }

      - name: PSScriptAnalyzer
        id: analyzer
        if: always()
        shell: powershell
        run: .\tools\Invoke-PSScriptAnalyzer.ps1

      - name: Deep pre-sign contract
        id: deep
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path ci-forensics/deep-presign-transcript.txt -Force | Out-Null
          try {
            .\tools\Invoke-PrometheusLocalValidation.ps1 -Mode PreSign -Worker -WorkerLabel 'Windows PowerShell 5.1 / ${{ matrix.runner }}'
          } finally {
            Stop-Transcript | Out-Null
          }

      - name: Capture compatibility diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSVersionTable | Out-String | Set-Content ci-forensics/pwsh-version.txt
          Get-ComputerInfo | Out-String -Width 240 | Set-Content ci-forensics/computer.txt
          git status --short | Set-Content ci-forensics/git-status.txt
          git diff -- . | Set-Content ci-forensics/git-diff.txt
          Get-FileHash bootstrap.ps1,windo_install.ps1,windo_runner.ps1,windo_uninstall.ps1 -Algorithm SHA256 |
            Format-Table -AutoSize | Out-String -Width 240 | Set-Content ci-forensics/release-hashes.txt
          @(
            'module=${{ steps.module.outcome }}',
            'dpapi=${{ steps.dpapi.outcome }}',
            'release=${{ steps.release.outcome }}',
            'logic=${{ steps.logic.outcome }}',
            'analyzer=${{ steps.analyzer.outcome }}',
            'deep=${{ steps.deep.outcome }}'
          ) | Set-Content ci-forensics/step-outcomes.txt

      - name: Upload PS5.1 forensic pack
        if: always() && (steps.module.outcome != 'success' || steps.dpapi.outcome != 'success' || steps.release.outcome != 'success' || steps.logic.outcome != 'success' || steps.analyzer.outcome != 'success' || steps.deep.outcome != 'success')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forensics-ps51-${{ matrix.runner }}
          path: ci-forensics
          if-no-files-found: error
          retention-days: 7

      - name: Enforce PS5.1 compatibility or exact issue 8 baseline
        if: always()
        shell: powershell
        run: |
          .\tools\Test-WindoKnownPs51Baseline.ps1 `
            -ProbePath 'ci-forensics/ps51-dpapi-probe.txt' `
            -LogicTranscriptPath 'ci-forensics/logic-transcript.txt' `
            -DeepTranscriptPath 'ci-forensics/deep-presign-transcript.txt' `
            -ModuleOutcome '${{ steps.module.outcome }}' `
            -DpapiOutcome '${{ steps.dpapi.outcome }}' `
            -ReleaseOutcome '${{ steps.release.outcome }}' `
            -LogicOutcome '${{ steps.logic.outcome }}' `
            -AnalyzerOutcome '${{ steps.analyzer.outcome }}' `
            -DeepOutcome '${{ steps.deep.outcome }}'

  compatibility-ps7:
    name: PS7 / ${{ matrix.runner }}
    needs: source-contract
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -ErrorAction Stop

      - name: Release validation
        shell: pwsh
        run: ./tools/Validate-Windo.ps1 -RequireCurrentSnapshot

      - name: Logic tests
        shell: pwsh
        run: ./tools/Test-WindoLogic.ps1

      - name: PSScriptAnalyzer
        shell: pwsh
        run: ./tools/Invoke-PSScriptAnalyzer.ps1

      - name: Deep pre-sign contract
        shell: pwsh
        run: ./tools/Invoke-PrometheusLocalValidation.ps1 -Mode PreSign -Worker -WorkerLabel 'PowerShell 7 / ${{ matrix.runner }}'

      - name: Capture failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path ci-forensics | Out-Null
          $PSVersionTable | Out-String | Set-Content ci-forensics/powershell.txt
          Get-ComputerInfo | Out-String -Width 240 | Set-Content ci-forensics/computer.txt
          git status --short | Set-Content ci-forensics/git-status.txt
          git diff -- . | Set-Content ci-forensics/git-diff.txt
          Get-FileHash bootstrap.ps1,windo_install.ps1,windo_runner.ps1,windo_uninstall.ps1 -Algorithm SHA256 |
            Format-Table -AutoSize | Out-String -Width 240 | Set-Content ci-forensics/release-hashes.txt

      - name: Upload failure forensics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forensics-ps7-${{ matrix.runner }}
          path: ci-forensics
          if-no-files-found: warn
          retention-days: 7

  generated-artifacts:
    name: Generated artifact reproducibility
    needs: source-contract
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Regenerate ChildExec payload
        shell: pwsh
        run: ./tools/Encode-ChildExec.ps1

      - name: Demand clean generated diff
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diff = git status --short -- tools/ChildExec.b64.txt
          if ($diff) {
            git diff -- tools/ChildExec.b64.txt
            throw 'Generated ChildExec payload drift detected. Regenerate and commit it.'
          }

      - name: Export exact source archive
        shell: pwsh
        run: git archive --format=zip --output=windo-source-${{ github.sha }}.zip HEAD

      - name: Upload exact source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windo-source-${{ github.sha }}
          path: windo-source-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 7

  negative-path:
    name: Fail-closed trust boundaries
    needs: source-contract
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Tampered signed manifest must fail
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tampered = Join-Path $env:RUNNER_TEMP 'installer-tampered.sha256'
          Copy-Item checksums/installer.sha256 $tampered
          Add-Content -LiteralPath $tampered -Value '# intentional CI tamper'

          & pwsh -NoLogo -NoProfile -File ./tools/Test-WindoChecksumSignature.ps1 -ManifestPath $tampered
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            throw 'Signature verifier unexpectedly accepted a tampered manifest.'
          }
          Write-Host "Expected signature rejection observed (exit=$code)."
          $global:LASTEXITCODE = 0

      - name: Hosted elevated bootstrap boundary must fail cleanly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CI = '1'
          $output = (& pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File ./bootstrap.ps1 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $output

          if ($code -eq 0) {
            throw 'bootstrap.ps1 unexpectedly succeeded from the elevated GitHub-hosted Windows runner.'
          }
          if ($output -notmatch 'bootstrap is disabled in elevated shells') {
            throw 'bootstrap.ps1 failed, but not at the expected explicit elevated-shell boundary.'
          }
          Write-Host "Expected hosted-runner UAC boundary observed (exit=$code)."
          $global:LASTEXITCODE = 0

  workflow-policy:
    name: Workflow security policy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Enforce pinned actions in WINDO workflows
        shell: bash
        run: |
          set -euo pipefail
          files=(.github/workflows/windo-*.yml)
          for file in "${files[@]}"; do
            [[ -e "$file" ]] || continue
            while IFS= read -r line; do
              ref="${line##*@}"
              if [[ ! "$ref" =~ ^[0-9a-f]{40}([[:space:]]|$) ]]; then
                echo "::error file=$file::Action reference is not pinned to a full commit SHA: $line"
                exit 1
              fi
            done < <(grep -E '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*[^#]+@' "$file" || true)
          done

  ci-green:
    name: WINDO CI green
    if: always()
    needs:
      - source-contract
      - compatibility-ps51
      - compatibility-ps7
      - generated-artifacts
      - negative-path
      - workflow-policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce aggregate result
        shell: bash
        run: |
          test '${{ needs.source-contract.result }}' = 'success'
          test '${{ needs.compatibility-ps51.result }}' = 'success'
          test '${{ needs.compatibility-ps7.result }}' = 'success'
          test '${{ needs.generated-artifacts.result }}' = 'success'
          test '${{ needs.negative-path.result }}' = 'success'
          test '${{ needs.workflow-policy.result }}' = 'success'
