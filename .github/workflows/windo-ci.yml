name: WINDO CI Fabric

on:
  push:
    branches:
      - jonex/windo-production-ready
      - ci/hosted-runner-lab-20260903
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches:
      - jonex/windo-production-ready
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WINDO_DEVELOPMENT_PRESIGN: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
  PSSCRIPTANALYZER_VERSION: '1.25.0'

jobs:
  source-contract:
    name: Source + trust contract
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Parse critical scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'bootstrap.ps1',
            'windo_install.ps1',
            'windo_runner.ps1',
            'windo_uninstall.ps1',
            'windo_heal.ps1',
            'tools/Test-WindoLogic.ps1',
            'tools/Test-WindoKnownPs51Baseline.ps1',
            'tools/Test-WindoPs51DpapiRuntime.ps1',
            'tools/Test-WindoChildExecStress.ps1',
            'tools/Validate-Windo.ps1',
            'tools/Test-WindoReservedVariables.ps1',
            'tools/Invoke-PrometheusLocalValidation.ps1',
            'tools/Test-WindoChecksumSignature.ps1'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing required file: $file" }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "PowerShell parse failed: $file"
            }
          }

      - name: Reject reserved automatic-variable assignments
        shell: pwsh
        run: ./tools/Test-WindoReservedVariables.ps1

      - name: Verify ChildExec source payload parity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = [IO.File]::ReadAllText((Resolve-Path 'src/windo/snippets/ChildExec.cs'))
          $encoded = ([IO.File]::ReadAllText((Resolve-Path 'tools/ChildExec.b64.txt')) -replace '\s','')
          $decoded = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($encoded))
          if ($source -cne $decoded) { throw 'ChildExec.cs and ChildExec.b64.txt are not byte-equivalent.' }

      - name: Verify production source contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrap = Get-Content -LiteralPath bootstrap.ps1 -Raw
          foreach ($needle in @(
            'jonex/windo-production-ready',
            'WINDO_RELEASE_COMMIT',
            'WINDO_TRACKING_BRANCH',
            'api.github.com/repos/l28bit/windo/commits/'
          )) {
            if ($bootstrap.IndexOf($needle, [StringComparison]::Ordinal) -lt 0) {
              throw "bootstrap.ps1 is missing required release-contract marker: $needle"
            }
          }

      - name: Generate unsigned candidate checksum manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:RUNNER_TEMP 'windo-unsigned-candidate'
          New-Item -ItemType Directory -Force -Path $candidate | Out-Null
          $env:WINDO_TRACKING_BRANCH = 'jonex/windo-production-ready'
          & ./tools/Sync-InstallerChecksum.ps1 -ChecksumPath (Join-Path $candidate 'installer.sha256')
          if (-not $?) { throw 'Canonical checksum generation failed.' }
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -notmatch '^[a-f0-9]{40}$') { throw 'Cannot bind candidate to checkout SHA.' }
          [IO.File]::WriteAllText((Join-Path $candidate 'checkout-sha.txt'), $head)
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Checksum generation unexpectedly changed tracked source.' }
          Write-Host 'UNSIGNED CANDIDATE ONLY: private signature and release acceptance required.'

      - name: Retain unsigned candidate checksum evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-candidate-checksums
          path: ${{ runner.temp }}/windo-unsigned-candidate
          if-no-files-found: error
          retention-days: 7

  signed-release:
    name: Signed release manifest (mandatory)
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft == true) }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Verify signed release manifest
        shell: pwsh
        run: ./tools/Test-WindoChecksumSignature.ps1

  compatibility-ps51:
    name: PS5.1 / ${{ matrix.runner }}
    needs: source-contract
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Initialize diagnostics
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path ci-forensics | Out-Null

      - name: Install PSScriptAnalyzer
        id: module
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -ErrorAction Stop

      - name: Certify shipping DPAPI resolver and CurrentUser round-trip
        id: dpapi
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path ci-forensics/ps51-dpapi-probe.txt -Force | Out-Null
          try {
            .\tools\Test-WindoPs51DpapiRuntime.ps1
          } finally {
            Stop-Transcript | Out-Null
          }

      - name: Release validation
        id: release
        if: always()
        shell: powershell
        run: |
          if ($env:WINDO_DEVELOPMENT_PRESIGN -eq 'true') {
            .\tools\Validate-Windo.ps1 -RequireCurrentSnapshot -DevelopmentPreSign
          } else {
            .\tools\Validate-Windo.ps1 -RequireCurrentSnapshot
          }

      - name: Logic tests
        id: logic
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path ci-forensics/logic-transcript.txt -Force | Out-Null
          try {
            .\tools\Test-WindoLogic.ps1
          } finally {
            Stop-Transcript | Out-Null
          }

      - name: Transparent shell completion contract
        if: always()
        shell: powershell
        run: .\tools\Test-WindoTransparentCompletion.ps1

      - name: Concurrent shipping executor stress
        id: stress
        if: always()
        shell: powershell
        run: .\tools\Test-WindoChildExecStress.ps1

      - name: PSScriptAnalyzer
        id: analyzer
        if: always()
        shell: powershell
        run: .\tools\Invoke-PSScriptAnalyzer.ps1

      - name: Deep pre-sign contract
        id: deep
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path ci-forensics/deep-presign-transcript.txt -Force | Out-Null
          try {
            .\tools\Invoke-PrometheusLocalValidation.ps1 -Mode PreSign -Worker -WorkerLabel 'Windows PowerShell 5.1 / ${{ matrix.runner }}'
          } finally {
            Stop-Transcript | Out-Null
          }

      - name: Capture compatibility diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSVersionTable | Out-String | Set-Content ci-forensics/pwsh-version.txt
          Get-ComputerInfo | Out-String -Width 240 | Set-Content ci-forensics/computer.txt
          git status --short | Set-Content ci-forensics/git-status.txt
          git diff -- . | Set-Content ci-forensics/git-diff.txt
          Get-FileHash bootstrap.ps1,windo_install.ps1,windo_runner.ps1,windo_uninstall.ps1 -Algorithm SHA256 |
            Format-Table -AutoSize | Out-String -Width 240 | Set-Content ci-forensics/release-hashes.txt
          @(
            'module=${{ steps.module.outcome }}',
            'dpapi=${{ steps.dpapi.outcome }}',
            'release=${{ steps.release.outcome }}',
            'logic=${{ steps.logic.outcome }}',
            'analyzer=${{ steps.analyzer.outcome }}',
            'deep=${{ steps.deep.outcome }}',
            'stress=${{ steps.stress.outcome }}'
          ) | Set-Content ci-forensics/step-outcomes.txt

      - name: Upload PS5.1 forensic pack
        if: always() && (steps.module.outcome != 'success' || steps.dpapi.outcome != 'success' || steps.release.outcome != 'success' || steps.logic.outcome != 'success' || steps.analyzer.outcome != 'success' || steps.deep.outcome != 'success' || steps.stress.outcome != 'success')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forensics-ps51-${{ matrix.runner }}
          path: ci-forensics
          if-no-files-found: error
          retention-days: 7

      - name: Enforce strict PS5.1 results (no issue 8 waiver)
        if: always()
        shell: powershell
        run: |
          $outcomes = @(
            '${{ steps.module.outcome }}',
            '${{ steps.dpapi.outcome }}',
            '${{ steps.release.outcome }}',
            '${{ steps.logic.outcome }}',
            '${{ steps.analyzer.outcome }}',
            '${{ steps.deep.outcome }}',
            '${{ steps.stress.outcome }}'
          )
          if (@($outcomes | Where-Object { $_ -ne 'success' }).Count -ne 0) {
            throw ('PS5.1 required checks failed or did not execute: ' + ($outcomes -join ', '))
          }

  compatibility-ps7:
    name: PS7 / ${{ matrix.runner }}
    needs: source-contract
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -ErrorAction Stop

      - name: Release validation
        shell: pwsh
        run: |
          if ($env:WINDO_DEVELOPMENT_PRESIGN -eq 'true') {
            ./tools/Validate-Windo.ps1 -RequireCurrentSnapshot -DevelopmentPreSign
          } else {
            ./tools/Validate-Windo.ps1 -RequireCurrentSnapshot
          }

      - name: Logic tests
        if: always()
        shell: pwsh
        run: ./tools/Test-WindoLogic.ps1

      - name: Transparent shell completion contract
        if: always()
        shell: pwsh
        run: ./tools/Test-WindoTransparentCompletion.ps1

      - name: Concurrent shipping executor stress
        if: always()
        shell: pwsh
        run: ./tools/Test-WindoChildExecStress.ps1

      - name: PSScriptAnalyzer
        if: always()
        shell: pwsh
        run: ./tools/Invoke-PSScriptAnalyzer.ps1

      - name: Deep pre-sign contract
        if: always()
        shell: pwsh
        run: ./tools/Invoke-PrometheusLocalValidation.ps1 -Mode PreSign -Worker -WorkerLabel 'PowerShell 7 / ${{ matrix.runner }}'

      - name: Capture failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path ci-forensics | Out-Null
          $PSVersionTable | Out-String | Set-Content ci-forensics/powershell.txt
          Get-ComputerInfo | Out-String -Width 240 | Set-Content ci-forensics/computer.txt
          git status --short | Set-Content ci-forensics/git-status.txt
          git diff -- . | Set-Content ci-forensics/git-diff.txt
          Get-FileHash bootstrap.ps1,windo_install.ps1,windo_runner.ps1,windo_uninstall.ps1 -Algorithm SHA256 |
            Format-Table -AutoSize | Out-String -Width 240 | Set-Content ci-forensics/release-hashes.txt

      - name: Upload failure forensics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forensics-ps7-${{ matrix.runner }}
          path: ci-forensics
          if-no-files-found: warn
          retention-days: 7

  generated-artifacts:
    name: Generated artifact reproducibility
    needs: source-contract
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Regenerate ChildExec payload
        shell: pwsh
        run: ./tools/Encode-ChildExec.ps1

      - name: Demand clean generated diff
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diff = git status --short -- tools/ChildExec.b64.txt
          if ($diff) {
            git diff -- tools/ChildExec.b64.txt
            throw 'Generated ChildExec payload drift detected. Regenerate and commit it.'
          }

      - name: Export exact source archive
        shell: pwsh
        run: git archive --format=zip --output=windo-source-${{ github.sha }}.zip HEAD

      - name: Upload exact source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windo-source-${{ github.sha }}
          path: windo-source-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 7

  negative-path:
    name: Fail-closed trust boundaries
    needs: source-contract
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Tampered signed manifest must fail
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tampered = Join-Path $env:RUNNER_TEMP 'installer-tampered.sha256'
          # Verify a previously signed snapshot first so a stale candidate
          # signature cannot make the tamper test pass vacuously.
          $fixture = 'versions/v8.5.9'
          $manifest = Join-Path $fixture 'checksums/installer.sha256'
          $signature = Join-Path $fixture 'checksums/installer.sha256.sig'
          $key = Join-Path $fixture 'keys/windo-release-public.rsa.xml'
          & pwsh -NoLogo -NoProfile -File ./tools/Test-WindoChecksumSignature.ps1 -ManifestPath $manifest -SignaturePath $signature -PublicKeyPath $key
          if ($LASTEXITCODE -ne 0) { throw 'Signed positive-control fixture failed verification.' }
          Copy-Item $manifest $tampered
          Add-Content -LiteralPath $tampered -Value '# intentional CI tamper'

          & pwsh -NoLogo -NoProfile -File ./tools/Test-WindoChecksumSignature.ps1 -ManifestPath $tampered -SignaturePath $signature -PublicKeyPath $key
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            throw 'Signature verifier unexpectedly accepted a tampered manifest.'
          }
          Write-Host "Expected signature rejection observed (exit=$code)."
          $global:LASTEXITCODE = 0

      - name: Unsigned development mode must reject corrupted candidate hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = (Resolve-Path 'checksums/installer.sha256').Path
          $originalBytes = [IO.File]::ReadAllBytes($manifestPath)
          try {
            $text = [Text.Encoding]::UTF8.GetString($originalBytes)
            $pattern = '(?m)^installerSha256=[A-Fa-f0-9]{64}\r?$'
            if ([regex]::Matches($text, $pattern).Count -ne 1) { throw 'Expected exactly one installer SHA256 field.' }
            $corrupt = [regex]::Replace($text, $pattern, ('installerSha256=' + ('0' * 64)))
            [IO.File]::WriteAllText($manifestPath, $corrupt, [Text.UTF8Encoding]::new($false))
            $result = (& pwsh -NoLogo -NoProfile -File ./tools/Validate-Windo.ps1 -RequireCurrentSnapshot -DevelopmentPreSign 2>&1 | Out-String)
            $code = $LASTEXITCODE
            Write-Host $result
            if ($code -eq 0 -or $result -notmatch 'installerSha256 does not match windo_install\.ps1') {
              throw 'Development validator did not reject the deliberately corrupted installer digest.'
            }
          } finally {
            [IO.File]::WriteAllBytes($manifestPath, $originalBytes)
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Negative test left tracked source modifications.' }
          Write-Host 'PASS: development signature deferral cannot bypass installer integrity.'

      - name: Hosted elevated bootstrap boundary must fail cleanly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CI = '1'
          $output = (& pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File ./bootstrap.ps1 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $output

          if ($code -eq 0) {
            throw 'bootstrap.ps1 unexpectedly succeeded from the elevated GitHub-hosted Windows runner.'
          }
          if ($output -notmatch 'bootstrap is disabled in elevated shells') {
            throw 'bootstrap.ps1 failed, but not at the expected explicit elevated-shell boundary.'
          }
          Write-Host "Expected hosted-runner UAC boundary observed (exit=$code)."
          $global:LASTEXITCODE = 0

  workflow-policy:
    name: Workflow security policy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Enforce pinned actions in WINDO workflows
        shell: bash
        run: |
          set -euo pipefail
          files=(.github/workflows/windo-*.yml)
          for file in "${files[@]}"; do
            [[ -e "$file" ]] || continue
            while IFS= read -r line; do
              ref="${line##*@}"
              if [[ ! "$ref" =~ ^[0-9a-f]{40}([[:space:]]|$) ]]; then
                echo "::error file=$file::Action reference is not pinned to a full commit SHA: $line"
                exit 1
              fi
            done < <(grep -E '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*[^#]+@' "$file" || true)
          done

  development-green:
    name: WINDO development qualified (unsigned)
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
    needs:
      - source-contract
      - compatibility-ps51
      - compatibility-ps7
      - generated-artifacts
      - negative-path
      - workflow-policy
    runs-on: ubuntu-latest
    steps:
      - name: Require every development gate
        shell: bash
        run: |
          test '${{ needs.source-contract.result }}' = 'success'
          test '${{ needs.compatibility-ps51.result }}' = 'success'
          test '${{ needs.compatibility-ps7.result }}' = 'success'
          test '${{ needs.generated-artifacts.result }}' = 'success'
          test '${{ needs.negative-path.result }}' = 'success'
          test '${{ needs.workflow-policy.result }}' = 'success'
          echo 'Development qualification only. No production release authorization.'

      - name: Checkout qualified candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Record unsigned development qualification receipt
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess

          checkout = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          for sha in (checkout, os.environ["PR_HEAD_SHA"], os.environ["PR_BASE_SHA"]):
              if not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise RuntimeError("Invalid qualification commit identity")
          if checkout != os.environ["GITHUB_SHA"]:
              raise RuntimeError("Qualification checkout does not match the tested workflow SHA")
          manifest = pathlib.Path("checksums/installer.sha256").read_bytes()
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "windo-development-qualification"
          output.mkdir()
          receipt = {
              "schemaVersion": 1,
              "classification": "UNSIGNED_DEVELOPMENT_ONLY",
              "productionReleaseAuthorized": False,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "checkoutSha": checkout,
              "prHeadSha": os.environ["PR_HEAD_SHA"],
              "prBaseSha": os.environ["PR_BASE_SHA"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "workflowRunAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "manifestFileSha256": hashlib.sha256(manifest).hexdigest(),
              "requiredJobs": ["source-contract", "compatibility-ps51", "compatibility-ps7",
                               "generated-artifacts", "negative-path", "workflow-policy"],
              "windowsMatrix": ["windows-2022/PS5.1", "windows-2025/PS5.1",
                                "windows-2022/PS7", "windows-2025/PS7"],
              "limitations": ["Not a cryptographic release attestation",
                              "No interactive UAC or owner-local lifecycle certification",
                              "No production signing or publication authority"]
          }
          (output / "qualification.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          (output / "installer.sha256").write_bytes(manifest)
          PY

      - name: Retain development qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-development-qualification
          path: ${{ runner.temp }}/windo-development-qualification
          if-no-files-found: error
          retention-days: 14

  ci-green:
    name: WINDO CI green
    if: ${{ always() && !(github.event_name == 'pull_request' && github.event.pull_request.draft == true) }}
    needs:
      - source-contract
      - signed-release
      - compatibility-ps51
      - compatibility-ps7
      - generated-artifacts
      - negative-path
      - workflow-policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce aggregate result
        shell: bash
        run: |
          test '${{ needs.source-contract.result }}' = 'success'
          test '${{ needs.signed-release.result }}' = 'success'
          test '${{ needs.compatibility-ps51.result }}' = 'success'
          test '${{ needs.compatibility-ps7.result }}' = 'success'
          test '${{ needs.generated-artifacts.result }}' = 'success'
          test '${{ needs.negative-path.result }}' = 'success'
          test '${{ needs.workflow-policy.result }}' = 'success'
